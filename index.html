<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title><!--title--></title>
    <meta name="description" content="<!--description-->" />
    <meta property="og:title" content="<!--title-->" />
    <meta property="og:description" content="<!--description-->" />
    <meta property="og:type" content="website" />
    <script>
      // apply the color mode before first paint; "color-mode" is ColorModeProvider's storageKey
      try {
        const m = localStorage.getItem("color-mode") || "system"
        const dark = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(dark ? "dark" : "light")
        // scroll reveals only hide content when motion is welcome (see index.css)
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches)
          document.documentElement.classList.add("motion-ok")
      } catch {}
    </script>
    <!--theme-style-->
  </head>
  <body>
    <div id="root" data-year="<!--year-->"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
