<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Kalender Cuti: a calendar sheet whose one week is a break (red block)
       stretched by leave (yellow highlighter swept behind the whole run).
       Colours come from src/index.css: merah, stabilo, line, ink. -->
  <rect width="512" height="512" rx="116" fill="#c44a42"/>
  <rect x="80" y="112" width="352" height="320" rx="56" fill="#ffffff"/>
  <!-- binding rings -->
  <rect x="160" y="74" width="36" height="84" rx="18" fill="#1a1a1f"/>
  <rect x="316" y="74" width="36" height="84" rx="18" fill="#1a1a1f"/>
  <!-- quiet days above and below -->
  <g fill="#e3e2e7">
    <circle cx="142" cy="380" r="19"/><circle cx="216" cy="380" r="19"/><circle cx="290" cy="380" r="19"/><circle cx="364" cy="380" r="19"/>
  </g>
  <!-- highlighter swept behind the whole long weekend: uneven ends, slightly off level -->
  <path d="M112 206 C113 193 121 186 136 186 L384 180 C402 180 412 190 411 208 L408 306 C407 322 397 330 380 330 L132 334 C118 334 110 326 110 312 Z" fill="#ffd84d"/>
  <!-- the break -->
  <rect x="128" y="204" width="200" height="110" rx="26" fill="#c44a42"/>
</svg>
